[package]
name = "nano-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "nano_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
bytes = "1.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.145"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
rtp = "0.17.2"
rtcp = "0.17.2"
webrtc = "0.17.2"
webrtc-media = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
