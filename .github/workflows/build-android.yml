name: Build Android APK

on:
  workflow_dispatch:   # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias JS (yarn 4)
        run: |
          corepack enable
          yarn install

      # nano-rs se compila con cargo desde Gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;23.1.7779620"

      - name: Compilar APK (dev debug, solo arm64)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-apk
          path: android/app/build/outputs/apk/dev/debug/*.apk
